name: Build and test distributions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  managed-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install build twine
      # build's default behavior builds the wheel from the sdist, proving that
      # recursive submodule content is present without relying on .git metadata.
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_dist.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: distributions-managed
          path: dist/*
          if-no-files-found: error

  managed-test:
    needs: managed-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: distributions-managed
          path: dist
      - shell: bash
        run: python -m pip install "$(find dist -name '*.whl')[managed]" pytest
      - run: python -m pytest tests --ignore=tests/test_native.py

  native-build:
    needs: managed-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            image: quay.io/pypa/manylinux_2_28_x86_64:latest
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            image: quay.io/pypa/manylinux_2_28_aarch64:latest
          - os: macos-15
            rid: osx-arm64
          # Intel macOS remains available through local builds; hosted CI and
          # release wheels currently cover Apple Silicon only on macOS.
          - os: windows-2022
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        if: runner.os != 'Linux'
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: distributions-managed
          path: dist-managed
      - name: Build portable Linux wheel in manylinux
        if: runner.os == 'Linux'
        env:
          NATIVE_RID: ${{ matrix.rid }}
          MANYLINUX_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/io" -w /io -e NATIVE_RID "$MANYLINUX_IMAGE" bash scripts/build_manylinux.sh
      - name: Build native library and wheel
        if: runner.os != 'Linux'
        shell: bash
        env:
          NATIVE_RID: ${{ matrix.rid }}
        run: |
          python -m pip install build
          python scripts/build_native.py --rid "$NATIVE_RID"
          export ACADSHARP_NATIVE_DIR="$PWD/artifacts/native/$NATIVE_RID"
          python -m build --wheel --outdir dist-native packaging/native
      - name: Install only native dependencies
        shell: bash
        run: |
          python -m pip install dist-managed/*.whl dist-native/*.whl pytest twine
          python -c "import importlib.util; assert importlib.util.find_spec('pythonnet') is None"
          python -m twine check --strict dist-native/*
      - name: Test installed native wheel
        run: python -m pytest tests/test_native.py
      - uses: actions/upload-artifact@v7
        with:
          name: distributions-native-${{ matrix.rid }}
          path: dist-native/*.whl
          if-no-files-found: error

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -e '.[dev,docs]'
      - run: python -m ruff check src tests scripts setup.py packaging
      - name: Check package versions and pinned upstream provenance
        env:
          RELEASE_INDEX: testpypi
        run: python scripts/check_release.py
      - run: python scripts/generate_api.py --assembly src/acadsharp/_managed/ACadSharp.dll --check
      - run: python -m mkdocs build --strict

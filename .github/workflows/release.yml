name: Release to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      index:
        description: Package index (production requires an exact version tag)
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag and distribution versions agree
        env:
          RELEASE_INDEX: ${{ inputs.index || 'pypi' }}
        run: python scripts/check_release.py

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish ${{ matrix.project }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: acadsharp
            artifact_pattern: distributions-managed
            filename_prefix: acadsharp
            pypi_environment: pypi
            testpypi_environment: testpypi
          - project: acadsharp-native
            artifact_pattern: distributions-native-*
            filename_prefix: acadsharp_native
            pypi_environment: pypi-native
            testpypi_environment: testpypi-native
    environment:
      name: ${{ inputs.index == 'testpypi' && matrix.testpypi_environment || matrix.pypi_environment }}
      url: ${{ format('{0}/project/{1}/', inputs.index == 'testpypi' && 'https://test.pypi.org' || 'https://pypi.org', matrix.project) }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.artifact_pattern }}
          merge-multiple: true
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify artifacts belong to this publishing identity
        env:
          DISTRIBUTION_PREFIX: ${{ matrix.filename_prefix }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path

          artifacts = list(Path("dist").iterdir())
          if not artifacts:
              raise SystemExit("No distributions were downloaded")
          prefix = os.environ["DISTRIBUTION_PREFIX"] + "-"
          for artifact in artifacts:
              if (not artifact.is_file() or not artifact.name.startswith(prefix)
                      or not artifact.name.endswith((".whl", ".tar.gz"))):
                  raise SystemExit(f"Unexpected artifact for {prefix}: {artifact}")
          PYTHON
      - name: Publish this distribution with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          attestations: true

  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - name: Attach verified distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
